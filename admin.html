<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة متجر نبتة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2d6a4f;--d:#1b4332;--p:#d8f3dc;--bg:#f6f7f2;--line:#e1eadf}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tajawal,sans-serif;color:#24332a}.wrap{max-width:900px;margin:24px auto;padding:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #1b43320d}h1,h2{color:var(--d);margin-top:0}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #cbd9ce;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:11px 16px;background:var(--g);color:white;font:700 15px Tajawal;cursor:pointer;margin:5px 0}button.secondary{background:#e8f2e9;color:var(--d)}button.danger{background:#a33b3b}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid var(--line);padding:12px;border-radius:12px;margin:9px 0;display:flex;gap:12px;align-items:center}.item img{width:62px;height:62px;object-fit:cover;border-radius:8px}.item .info{flex:1;min-width:0}.muted{color:#68776d;font-size:14px}.hidden{display:none!important}#msg{padding:10px;border-radius:10px;background:#fff4d8;margin:10px 0;white-space:pre-wrap}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:15px}}
</style></head>
<body><main class="wrap">
<header class="top"><div><h1>🌿 لوحة إدارة نبتة</h1><div class="muted">صفحة خاصة بالمديرين المصرّح لهم</div></div><a href="/" class="muted">العودة إلى المتجر</a></header>
<div id="msg" class="hidden" role="status"></div>
<section id="login" class="panel"><h2>تسجيل الدخول</h2><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"><label for="pass">كلمة المرور</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn">دخول</button></section>
<section id="dashboard" class="hidden">
<div class="panel top"><div><h2>إدارة المنتجات</h2><div class="muted" id="who"></div></div><button class="secondary" id="logoutBtn">تسجيل الخروج</button></div>
<div class="panel"><h2 id="formTitle">إضافة منتج</h2><input id="pid" type="hidden"><div class="row"><div><label>اسم المنتج</label><input id="pname"></div><div><label>السعر (دج)</label><input id="price" type="number" min="0"></div></div><label>الوصف</label><textarea id="desc" rows="2"></textarea><label>رابط الصورة (اختياري)</label><input id="img" type="url" placeholder="https://..."><div><button id="saveProduct">حفظ المنتج</button><button class="secondary" id="clearProduct">تفريغ الحقول</button></div></div>
<div class="panel"><div id="products"><p class="muted">جارٍ تحميل المنتجات…</p></div></div>
<div class="panel"><h2>إعدادات المتجر</h2><label>اسم المتجر</label><input id="sname"><label>رسالة الترحيب</label><textarea id="welcome" rows="3"></textarea><label>رقم واتساب مع رمز الدولة</label><input id="phone"><button id="saveSettings">حفظ الإعدادات</button></div>
<div class="panel"><h2>تغيير كلمة المرور</h2><p class="muted">قد يطلب Firebase تسجيل الدخول مجدداً قبل تغيير كلمة المرور.</p><label>كلمة المرور الجديدة</label><input id="newpass" type="password" minlength="6"><button id="changePass">تحديث كلمة المرور</button></div>
</section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,updatePassword} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getDatabase,ref,get,set} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyDlXOHZsCKofG6jY9dyWGbHa3exdTKWAc0',authDomain:'nabta-e7a39.firebaseapp.com',databaseURL:'https://nabta-e7a39-default-rtdb.europe-west1.firebasedatabase.app',projectId:'nabta-e7a39',storageBucket:'nabta-e7a39.firebasestorage.app',messagingSenderId:'896214972798',appId:'1:896214972798:web:1b3e9e0beffdc7d9739b2f'};
const allowed=new Set(['Zi3hDypBtGggZPu4nQxea1WINXR2','JrIU6Bvb3FYGyAzEFGVDNa4m5DA3']);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);let currentProducts=[];
const $=id=>document.getElementById(id);function say(t){$('msg').textContent=t;$('msg').classList.remove('hidden')}function clearMsg(){$('msg').classList.add('hidden')}
function field(id){return $(id).value.trim()}
async function load(){const [p,s]=await Promise.all([get(ref(db,'products')),get(ref(db,'settings'))]);currentProducts=p.exists()?(Array.isArray(p.val())?p.val():Object.values(p.val())):[];const settings=s.exists()?s.val():{};$('sname').value=settings.name||'نبتة';$('welcome').value=settings.welcome||'';$('phone').value=settings.phone||'';render()}
function render(){const root=$('products');root.replaceChildren();if(!currentProducts.length){root.textContent='لا توجد منتجات بعد.';return}currentProducts.forEach((p,i)=>{const box=document.createElement('div');box.className='item';if(p.img&&/^https?:\/\//i.test(p.img)){const im=document.createElement('img');im.src=p.img;im.alt=p.name||'صورة منتج';box.append(im)}const info=document.createElement('div');info.className='info';const name=document.createElement('strong');name.textContent=p.name||'منتج';const price=document.createElement('div');price.className='muted';price.textContent=(p.price??0)+' دج';info.append(name,price);box.append(info);const edit=document.createElement('button');edit.className='secondary';edit.textContent='تعديل';edit.onclick=()=>{ $('pid').value=String(i);$('pname').value=p.name||'';$('price').value=p.price??'';$('desc').value=p.desc||'';$('img').value=p.img||'';$('formTitle').textContent='تعديل منتج'};const del=document.createElement('button');del.className='danger';del.textContent='حذف';del.onclick=async()=>{if(!confirm('هل تريدين حذف هذا المنتج؟'))return;currentProducts.splice(i,1);await set(ref(db,'products'),currentProducts);render();say('تم حذف المنتج')};box.append(edit,del);root.append(box)})}
$('loginBtn').onclick=async()=>{clearMsg();try{await signInWithEmailAndPassword(auth,field('email'),$('pass').value)}catch(e){say('تعذّر تسجيل الدخول: '+e.message)}};
onAuthStateChanged(auth,async user=>{if(!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}if(!allowed.has(user.uid)){await signOut(auth);say('هذا الحساب غير مخوّل لإدارة المتجر.');return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('who').textContent='تم تسجيل الدخول: '+user.email;try{await load()}catch(e){say('تعذّر تحميل بيانات Firebase: '+e.message)}});
$('logoutBtn').onclick=()=>signOut(auth);
$('clearProduct').onclick=()=>{['pid','pname','price','desc','img'].forEach(x=>$(x).value='');$('formTitle').textContent='إضافة منتج'};
$('saveProduct').onclick=async()=>{const name=field('pname'),price=Number(field('price'));if(!name||!Number.isFinite(price)||price<0){say('أدخلي اسم المنتج وسعراً صحيحاً.');return}const p={name,price,desc:field('desc'),img:field('img')};const id=field('pid');if(id==='')currentProducts.push(p);else currentProducts[Number(id)]=p;try{await set(ref(db,'products'),currentProducts);render();$('clearProduct').click();say('تم حفظ المنتج.')}catch(e){say('تعذّر الحفظ: '+e.message)}};
$('saveSettings').onclick=async()=>{try{await set(ref(db,'settings'),{name:field('sname')||'نبتة',welcome:field('welcome'),phone:field('phone')});say('تم حفظ الإعدادات.')}catch(e){say('تعذّر حفظ الإعدادات: '+e.message)}};
$('changePass').onclick=async()=>{const p=$('newpass').value;if(p.length<6){say('كلمة المرور يجب أن تكون 6 أحرف على الأقل.');return}try{await updatePassword(auth.currentUser,p);$('newpass').value='';say('تم تحديث كلمة المرور.')}catch(e){say('تعذّر تغيير كلمة المرور: '+e.message+' إذا طُلبت إعادة تسجيل الدخول، سجّلي الخروج ثم ادخلي مجدداً.')}};
</script></body></html>
